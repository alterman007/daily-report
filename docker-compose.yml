services:
  daily-report:
    image: ${IMAGE_REF:-daily-report:latest}
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/daily-report.db
      TZ: Asia/Shanghai
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - daily-report-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--disable-warning=ExperimentalWarning",
          "-e",
          "fetch('http://127.0.0.1:3000/api/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  daily-report-data:
